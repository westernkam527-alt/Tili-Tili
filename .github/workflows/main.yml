name: Build Tili Tili APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The repository is missing Android platform files (android/app/build.gradle).
      # Generate the Android scaffold without replacing the app's lib/main.dart.
      - name: Generate Android platform files if missing
        run: |
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create . --platforms=android --project-name tili_tili
          fi

      - name: Install packages
        run: flutter pub get

      - name: Build Android release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tili-tili-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          
