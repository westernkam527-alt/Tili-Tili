
name: Build Tili Tili APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter project
        run: |
          echo "Checking project files..."
          pwd
          ls -la
          test -f pubspec.yaml || (echo "ERROR: pubspec.yaml is missing" && exit 1)
          test -d lib || (echo "ERROR: lib folder is missing" && exit 1)

      - name: Generate Android platform
        run: |
          flutter create --platforms=android --project-name tili_tili .
          echo "Checking Android Gradle files..."
          ls -la android
          ls -la android/app
          test -f android/app/build.gradle || test -f android/app/build.gradle.kts

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tili-tili-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          
