publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  video_player: ^2.9.2
  share_plus: ^10.1.2
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter_test
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
